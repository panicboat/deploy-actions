name: 'Label Dispatcher'
description: 'Dispatch labels based on PR changes'
author: 'panicboat'

branding:
  icon: 'tag'
  color: 'green'

inputs:
  pr-number:
    description: 'Pull request number'
    required: true
  repository:
    description: 'Repository name (owner/repo)'
    required: true
  github-token:
    description: 'GitHub token with pull-requests: write permission'
    required: true
  config-path:
    description: 'Path to workflow configuration file'
    required: false
    default: 'workflow-config.yaml'

outputs:
  labels-added:
    description: 'Labels that were added to the PR'
    value: ${{ steps.dispatch.outputs.labels-added }}
  labels-removed:
    description: 'Labels that were removed from the PR'
    value: ${{ steps.dispatch.outputs.labels-removed }}
  services-detected:
    description: 'Services detected from the changes'
    value: ${{ steps.dispatch.outputs.services-detected }}
  has-changes:
    description: 'Whether any changes were detected'
    value: ${{ steps.dispatch.outputs.has-changes }}

runs:
  using: 'composite'
  steps:
    - name: Checkout source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        token: ${{ inputs.github-token }}
        path: source-repo
        fetch-depth: 0

    - name: Setup Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '4.0.7'
        bundler-cache: true
        working-directory: ${{ github.action_path }}/../action-scripts

    - name: Validate configuration
      shell: bash
      working-directory: ${{ github.action_path }}/../action-scripts
      run: |
        echo "🔍 Validating configuration file"
        bundle exec ruby config-manager/bin/config-manager validate
      env:
        WORKFLOW_CONFIG_PATH: ${{ github.workspace }}/source-repo/${{ inputs.config-path }}
        SOURCE_REPO_PATH: ${{ github.workspace }}/source-repo

    - name: Dispatch labels
      id: dispatch
      shell: bash
      working-directory: ${{ github.action_path }}/../action-scripts
      run: |
        echo "🚀 Starting label dispatch for PR #${{ inputs.pr-number }}"
        bundle exec ruby label-dispatcher/bin/dispatcher dispatch ${{ inputs.pr-number }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        WORKFLOW_CONFIG_PATH: ${{ github.workspace }}/source-repo/${{ inputs.config-path }}
        SOURCE_REPO_PATH: ${{ github.workspace }}/source-repo

    - name: Report results
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        script: |
          core.info('📊 Label dispatch completed');
          core.info(`Repository: ${process.env.REPOSITORY}`);
          core.info(`PR Number: ${process.env.PR_NUMBER}`);
          core.info(`Status: ${context.job.status || 'unknown'}`);
