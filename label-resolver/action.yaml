name: 'Label Resolver'
description: 'Resolve deployment targets from PR labels and branch information'
author: 'panicboat'

branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  repository:
    description: 'Repository name (owner/repo)'
    required: true
  ref:
    description: 'Ref of the source repository to check out; defaults to the event ref for the triggering repository and to the default branch for another repository'
    required: false
  pr-number:
    description: 'PR number (from prepare job output or event)'
    required: false
  service:
    description: 'Service name or all; when set, resolves its targets without a pull request and ignores pr-number'
    required: false
  environments:
    description: 'Target environments (comma-separated: develop,staging or single: develop)'
    required: false
  github-token:
    description: 'GitHub token with appropriate permissions'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path to workflow configuration file'
    required: false
    default: 'workflow-config.yaml'

outputs:
  targets:
    description: 'Deployment targets JSON'
    value: ${{ steps.extract.outputs.targets }}
  has-targets:
    description: 'Whether targets found'
    value: ${{ steps.extract.outputs.has-targets }}
  candidates:
    description: 'Every candidate target including the excluded ones; set only when service is given'
    value: ${{ steps.extract.outputs.candidates }}

runs:
  using: 'composite'
  steps:
    - name: Checkout source repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.github-token }}
        path: source-repo

    - name: Setup Ruby
      uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: '4.0.9'
        bundler-cache: true
        working-directory: ${{ github.action_path }}/../action-scripts

    - name: Validate configuration
      shell: bash
      working-directory: ${{ github.action_path }}/../action-scripts
      run: |
        echo "🔍 Validating configuration file"
        bundle exec ruby config-manager/bin/config-manager validate
      env:
        WORKFLOW_CONFIG_PATH: ${{ github.workspace }}/source-repo/${{ inputs.config-path }}
        SOURCE_REPO_PATH: ${{ github.workspace }}/source-repo

    - name: Resolve deployment targets
      id: extract
      shell: bash
      working-directory: ${{ github.action_path }}/../action-scripts
      run: |
        echo "🚀 Starting deployment target resolution"
        if [ -n "$SERVICE" ]; then
          echo "Service: $SERVICE"
          bundle exec ruby label-resolver/bin/resolver targets "$SERVICE" "$ENVIRONMENTS"
        else
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Set service or pr-number"
            exit 1
          fi
          echo "PR: $PR_NUMBER"
          bundle exec ruby label-resolver/bin/resolver resolve "$PR_NUMBER" "$ENVIRONMENTS"
        fi
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENTS: ${{ inputs.environments }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        WORKFLOW_CONFIG_PATH: ${{ github.workspace }}/source-repo/${{ inputs.config-path }}
        SOURCE_REPO_PATH: ${{ github.workspace }}/source-repo

    - name: Report results
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SERVICE: ${{ inputs.service }}
        TARGET_ENVIRONMENTS: ${{ inputs.environments }}
        DEPLOYMENT_TARGETS: ${{ steps.extract.outputs.targets }}
        HAS_TARGETS: ${{ steps.extract.outputs.has-targets }}
      with:
        script: |
          core.info('📊 Label Resolver completed');
          core.info(`Repository: ${process.env.REPOSITORY}`);
          core.info(process.env.SERVICE ? `Service: ${process.env.SERVICE}` : `PR Number: ${process.env.PR_NUMBER}`);
          core.info(`Target Environments: ${process.env.TARGET_ENVIRONMENTS || 'all'}`);
          core.info(`Deployment Targets: ${process.env.DEPLOYMENT_TARGETS || '[]'}`);
          core.info(`Has Targets: ${process.env.HAS_TARGETS || 'false'}`);
